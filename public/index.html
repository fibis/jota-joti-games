<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOTA-JOTI Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
<script src="/lib/phaser.js"></script>
<style>
  :root { --bg: #10231a; --panel: #1b3a2a; --line: #2c5640; --text: #f4efe6; --muted: #9fb5a6; --fire: #ff9f1c; --purple: #8b4fd0; --good: #3ddc84; --bad: #ff5a5f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; color: var(--text); font: 600 clamp(13px, min(1.45vw, 2.5vh), 40px)/1.35 system-ui, sans-serif; background: radial-gradient(ellipse at 50% -20%, #24503a, var(--bg) 60%, #08130e); background-color: var(--bg); overflow: hidden; }
  h1, h2 { margin: 0; }
  .muted { color: var(--muted); }
  kbd { font: 700 .85em ui-monospace, monospace; padding: .05em .4em; border-radius: .3em; background: var(--panel); border: 1px solid var(--line); border-bottom-width: 3px; }

  #lobby { height: 100%; overflow-y: auto; display: flex; flex-direction: column; padding: 1.4em 3vw; gap: 1.2em; } /* scrolls instead of clipping if a crowd still doesn't fit */
  #lobby > header { display: flex; align-items: baseline; gap: 1em; }
  h1 { font-size: 2.6em; font-weight: 900; letter-spacing: -.02em; }
  h1 span { color: var(--fire); }
  .room { margin-left: auto; color: var(--muted); }
  .room b { color: var(--text); font: 900 1.6em ui-monospace, monospace; letter-spacing: .15em; }
  #langs { display: inline-flex; align-self: center; border: 2px solid var(--line); border-radius: .5em; overflow: hidden; }
  #langs button { font: 800 .8em system-ui, sans-serif; background: none; color: var(--muted); border: 0; padding: .3em .7em; cursor: pointer; }
  #langs button.on { background: var(--fire); color: var(--bg); }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr); gap: 3vw; }
  .join { background: var(--panel); border-radius: 1.2em; padding: 1.5vw; display: flex; flex-direction: column; align-items: center; text-align: center; gap: .6em; border: 2px solid var(--line); }
  #qr { width: 100%; max-width: 22vw; aspect-ratio: 1; background: #fff; border-radius: .6em; padding: .5em; }
  #qr svg { width: 100%; height: 100%; display: block; }
  #url { font: .8em ui-monospace, monospace; color: var(--fire); overflow-wrap: anywhere; }
  .right { display: flex; flex-direction: column; gap: 1em; min-height: 0; }
  h2 { font-size: 1.2em; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  #players { display: flex; flex-wrap: wrap; gap: .5em; min-height: 2.6em; }
  .chip { display: inline-flex; align-items: center; gap: .35em; padding: .3em .8em .3em .4em; border-radius: 2em; background: var(--panel); border: 3px solid var(--c); animation: pop .35s ease-out; }
  .chip.off { opacity: .35; }
  .chip .av { font-size: 1.4em; line-height: 1; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  #games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2vw; }
  .game { font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--panel); border: 3px solid var(--line); border-radius: 1em; padding: 1.1em; display: flex; flex-direction: column; gap: .4em; transition: transform .15s, border-color .15s; }
  .game:hover, .game:focus-visible { transform: translateY(-4px); border-color: var(--fire); outline: none; }
  .game header { display: flex; align-items: center; gap: .4em; }
  .game .em { font-size: 2em; line-height: 1; }
  .game b { font-size: 1.3em; }
  .game p { margin: 0; color: var(--muted); font-weight: 500; font-size: .9em; flex: 1; }
  .game small { color: var(--fire); }
  #results:empty { display: none; }
  #results { background: linear-gradient(90deg, #3b2a0a, var(--panel)); border: 2px solid var(--fire); border-radius: 1em; padding: .7em 1em; display: flex; flex-wrap: wrap; gap: .4em 1.4em; align-items: center; }
  #toast { position: fixed; bottom: 2vw; left: 50%; transform: translateX(-50%); background: var(--fire); color: var(--bg); padding: .6em 1.2em; border-radius: .6em; font-weight: 800; transition: opacity .3s; }

  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 1.2em; padding: .3em 1em; background: #0007; font-size: .8em; }
  #gjoin { margin-right: auto; font-family: ui-monospace, monospace; }
  #stage-inner { position: relative; flex: 1; min-height: 0; }
  #exit { font: inherit; font-weight: 800; border: 0; border-radius: .4em; padding: .3em .9em; background: #ffffff1f; color: var(--text); cursor: pointer; }
  #exit:hover, #exit.sure { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<div id="lobby">
  <header>
    <h1>📻 JOTA-JOTI <span data-t="games"></span></h1>
    <div class="room"><span data-t="room"></span> <b id="code">····</b></div>
    <div id="langs"><button data-l="en">EN</button><button data-l="de">DE</button></div>
  </header>
  <div class="grid">
    <section class="join">
      <div id="qr"></div>
      <div><span data-t="scan"></span><br><span data-t="open"></span> <span id="url">…</span></div>
      <div class="muted" id="net"></div>
    </section>
    <section class="right">
      <h2><span data-t="scouts"></span> <span id="count"></span></h2>
      <div id="players"></div>
      <div class="muted" data-t="keys"></div>
      <div id="results"></div>
      <h2 data-t="pick"></h2>
      <div id="games"></div>
    </section>
  </div>
</div>
<div id="stage" hidden>
  <div id="bar"><span id="gname"></span><span id="gjoin" class="muted"></span><button id="exit" title="Esc"></button></div>
  <div id="stage-inner"></div>
</div>
<div id="toast" style="opacity:0"></div>

<script type="module">
import { MorseKey, tone, audio } from '/morse.js';

const L = {
  en: {
    games: 'Games', room: 'Room', scan: 'Scan to join', open: 'or open', wifi: 'Phones must be on the same Wi-Fi',
    scouts: 'Scouts', waiting: 'Waiting for scouts to join…', pick: 'Pick a game', last: 'Last game:',
    keys: 'No phone? Play on this keyboard: press <kbd>Space</kbd> (WASD · 1-4) or <kbd>Enter</kbd> (arrows · 7-0).',
    first: 'Scan the QR code or press Space first!', end: '✕ End game', sure: '✕ Click again to end', joinAt: 'Join:',
    in: 'You’re in! ⚜️', look: 'Look at the big screen 👀', won: 'You won! 🎉', played: 'Well played! Look at the big screen 👀', points: 'points',
    g: {
      foxhunt: ['Fox Hunt', 'Joystick', 'A hidden transmitter beeps “MO”. Follow the signal on your phone and grab the fox first!'],
      'morse-master': ['Morse Master', 'Telegraph key', 'Your phone is a Morse key. Tap the word in dits and dahs before the others.'],
      quiz: ['Scout Quiz', '4 buttons', 'Radio alphabet, Q-codes, knots and scouting history. Quick answers score more!'],
    },
  },
  de: {
    games: 'Spiele', room: 'Raum', scan: 'Scannen und mitspielen', open: 'oder öffne', wifi: 'Handys müssen im selben WLAN sein',
    scouts: 'Pfadfinder', waiting: 'Warte auf Pfadfinder…', pick: 'Spiel wählen', last: 'Letztes Spiel:',
    keys: 'Kein Handy? Spiel an dieser Tastatur: drück <kbd>Leertaste</kbd> (WASD · 1-4) oder <kbd>Enter</kbd> (Pfeiltasten · 7-0).',
    first: 'Erst den QR-Code scannen oder die Leertaste drücken!', end: '✕ Spiel beenden', sure: '✕ Nochmal klicken zum Beenden', joinAt: 'Mitspielen:',
    in: 'Du bist dabei! ⚜️', look: 'Schau auf den großen Bildschirm 👀', won: 'Gewonnen! 🎉', played: 'Gut gespielt! Schau auf den großen Bildschirm 👀', points: 'Punkte',
    g: {
      foxhunt: ['Fuchsjagd', 'Joystick', 'Ein versteckter Sender piept „MO“. Folge dem Signal auf deinem Handy und schnapp dir den Fuchs zuerst!'],
      'morse-master': ['Morse-Meister', 'Morsetaste', 'Dein Handy ist eine Morsetaste. Morse das Wort in Punkten und Strichen – schneller als die anderen.'],
      quiz: ['Pfadfinder-Quiz', '4 Knöpfe', 'Funkalphabet, Q-Codes, Knoten und Pfadfindergeschichte. Schnelle Antworten bringen mehr Punkte!'],
    },
  },
};
const GAMES = [{ file: 'foxhunt', em: '🦊' }, { file: 'morse-master', em: '📡' }, { file: 'quiz', em: '⚜️' }];
// Patrol animals as avatars (🦊 is taken by the fox).
const AVATARS = ['🐻', '🦉', '🐺', '🦌', '🐿️', '🦔', '🐸', '🦅', '🦡', '🐗', '🦫', '🐝', '🐢', '🦆', '🐞', '🐧'];
const COLORS = ['#ff9f1c', '#2ec4b6', '#ff5a5f', '#b388ff', '#4cc9f0', '#f9c74f', '#90be6d', '#f15bb5', '#fefae0', '#ff7b39', '#06d6a0', '#5e9bff'];
const KEYBOARDS = [
  { id: 'kb-wasd', name: 'WASD ⌨', join: 'Space', up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', act: 'Space', picks: ['Digit1', 'Digit2', 'Digit3', 'Digit4'] },
  { id: 'kb-arrows', name: '↑←↓→ ⌨', join: 'Enter', up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', act: 'Enter', picks: ['Digit7', 'Digit8', 'Digit9', 'Digit0'] },
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const medal = i => ['🥇', '🥈', '🥉'][i] ?? `${i + 1}.`;
const players = new Map(); // id -> { id, name, avatar, color, online, ui, kb? }
let ws, game = null, joinText = '', tunnel = false, lastRanked = null, exitTimer;
let lang = (() => { try { return localStorage.jjLang; } catch {} })();
if (!L[lang]) lang = navigator.language?.startsWith('de') ? 'de' : 'en';
let T = L[lang];
const lobbyUi = () => ({ layout: 'wait', text: T.in, sub: T.look });

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?role=host&room=${sessionStorage.jjRoom || ''}&key=${sessionStorage.jjKey || ''}`);
  // After a server restart only phones that really come back get a 'join'; everyone else is gone.
  // (No game notification here: the server replays live phones within milliseconds, so a blip must not end a round.)
  ws.onopen = () => { for (const p of players.values()) if (!p.kb) p.online = false; renderLobby(); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'room') {
      sessionStorage.jjRoom = m.code;
      sessionStorage.jjKey = m.key;
      joinText = m.url.replace(/^https?:\/\//, '');
      tunnel = m.url.startsWith('https:');
      $('code').textContent = m.code;
      $('url').textContent = joinText;
      $('qr').innerHTML = m.qr;
      renderStatic();
    }
    if (m.t === 'join') join(m.id, m.name);
    if (m.t === 'leave' && players.has(m.id)) { presence(players.get(m.id), false); renderLobby(); }
    if (m.t === 'msg' && players.has(m.id) && m.d && typeof m.d === 'object') game?.input(players.get(m.id), m.d);
  };
  ws.onclose = () => setTimeout(connect, 1000);
}

function join(id, name, kb) {
  let p = players.get(id);
  const isNew = !p;
  if (isNew) players.set(id, p = { id, kb, avatar: AVATARS[players.size % AVATARS.length], color: COLORS[players.size % COLORS.length] });
  p.name = String(name).slice(0, 14);
  if (kb) p.mk = new MorseKey(c => game?.input(p, { t: 'letter', c }), s => game?.input(p, { t: 'sym', s }));
  presence(p, true);
  if (isNew && game) game.join(p); else send(p, p.ui ?? lobbyUi()); // reconnecting phones get their last controller back
  renderLobby();
}

// Games hear about comings and goings: a dropped scout stops running, a round can end without them.
function presence(p, online) {
  p.online = online;
  game?.input(p, { t: 'presence' });
}

// Games call this to set a player's controller. Keyboard players just remember it.
function send(p, ui) {
  p.ui = ui;
  if (!p.kb && ws?.readyState === 1) ws.send(JSON.stringify({ to: p.id, d: { ...ui, avatar: p.avatar, color: p.color, lang } }));
}

function renderLobby() {
  const list = [...players.values()];
  $('count').textContent = list.length ? `(${list.filter(p => p.online).length})` : '';
  $('players').innerHTML = list.length
    ? list.map(p => `<span class="chip ${p.online ? '' : 'off'}" style="--c:${p.color}"><span class="av">${p.avatar}</span>${esc(p.name)}</span>`).join('')
    : `<span class="muted">${T.waiting}</span>`;
}

// Everything that changes with the language (or the join URL).
function renderStatic() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = T[el.dataset.t];
  for (const b of $('langs').children) b.classList.toggle('on', b.dataset.l === lang);
  $('net').textContent = tunnel ? '' : T.wifi;
  $('gjoin').textContent = `${T.joinAt} ${joinText}`;
  $('games').innerHTML = GAMES.map((g, i) => { const [title, ctl, desc] = T.g[g.file]; return `<button class="game" data-i="${i}"><header><span class="em">${g.em}</span><b>${title}</b></header><p>${desc}</p><small>🎮 ${ctl}</small></button>`; }).join('');
  $('results').innerHTML = lastRanked ? `<b>${T.last}</b>` + lastRanked.map(([p, s], i) => `<span>${medal(i)} ${p.avatar} ${esc(p.name)} <b>${s}</b></span>`).join('') : '';
  renderLobby();
}

$('langs').onclick = e => {
  const l = e.target.dataset?.l;
  if (!L[l] || l === lang) return;
  T = L[lang = l];
  try { localStorage.jjLang = lang; } catch {}
  renderStatic();
  if (!game) for (const p of players.values()) send(p, lobbyUi());
};
$('games').onclick = e => { const b = e.target.closest('.game'); if (b) startGame(GAMES[b.dataset.i]); };

// End game: two clicks so a stray click doesn't wipe a round. Esc ends right away.
function armExit(on) {
  clearTimeout(exitTimer);
  $('exit').classList.toggle('sure', on);
  $('exit').textContent = on ? T.sure : T.end;
  if (on) exitTimer = setTimeout(() => armExit(false), 3000);
}
$('exit').onclick = () => $('exit').classList.contains('sure') ? endGame() : armExit(true);

function toast(msg) { $('toast').textContent = msg; $('toast').style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').style.opacity = 0, 2500); }

async function startGame(g) {
  if (!players.size) return toast(T.first);
  document.activeElement?.blur(); // so Space/Enter can't re-click the card
  audio().resume();
  const mod = await import(`./games/${g.file}.js`);
  $('gname').textContent = `${g.em} ${T.g[g.file][0]}`;
  armExit(false);
  $('lobby').hidden = true;
  $('stage').hidden = false;
  $('stage-inner').replaceChildren();
  game = mod.start({ stage: $('stage-inner'), players: [...players.values()], send, esc, end: endGame, lang });
}

// scores: [[player, points], ...] or nothing when aborted.
function endGame(scores) {
  game?.stop();
  game = null;
  armExit(false);
  $('stage').hidden = true;
  $('lobby').hidden = false;
  for (const p of players.values()) send(p, lobbyUi());
  if (!scores) return;
  lastRanked = [...scores].sort((a, b) => b[1] - a[1]);
  renderStatic();
  lastRanked.forEach(([p, s], i) => send(p, { layout: 'wait', text: `${medal(i)} ${s} ${T.points}`, sub: i === 0 ? T.won : T.played }));
}

// Keyboard players: same messages a phone would send.
const held = new Set();
const ALL_KEYS = new Set(KEYBOARDS.flatMap(k => [k.up, k.down, k.left, k.right, k.act, ...k.picks]));
function key(e, down) {
  if (e.code === 'Escape' && down && game) return endGame();
  if (!ALL_KEYS.has(e.code)) return;
  e.preventDefault();
  if (e.repeat) return;
  down ? held.add(e.code) : held.delete(e.code);
  for (const k of KEYBOARDS) {
    const p = players.get(k.id);
    if (!p) { if (down && !game && e.code === k.join) join(k.id, k.name, k); continue; }
    if (!game) continue;
    const layout = p.ui?.layout;
    if (layout === 'stick' && [k.up, k.down, k.left, k.right].includes(e.code)) {
      let x = held.has(k.right) - held.has(k.left), y = held.has(k.down) - held.has(k.up);
      if (x && y) { x *= Math.SQRT1_2; y *= Math.SQRT1_2; }
      game.input(p, { t: 'stick', x, y });
    }
    if (layout === 'key' && e.code === k.act) { down ? p.mk.down() : p.mk.up(); tone(down); }
    if (layout === 'choices' && down && k.picks.includes(e.code)) game.input(p, { t: 'pick', i: k.picks.indexOf(e.code) });
  }
}
addEventListener('keydown', e => key(e, true));
addEventListener('keyup', e => key(e, false));

renderStatic();
connect();
</script>
</body>
</html>
