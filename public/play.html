<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10231a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
<title>JOTA-JOTI Controller</title>
<style>
  :root { --bg: #10231a; --panel: #1b3a2a; --text: #f4efe6; --muted: #9fb5a6; --fire: #ff9f1c; --me: #ff9f1c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 600 18px/1.3 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; touch-action: none; }
  header { display: flex; align-items: center; gap: .5em; padding: .6em 1em; background: var(--panel); border-bottom: 5px solid var(--me); }
  header .av { font-size: 1.7em; line-height: 1; }
  #status { margin-left: auto; color: var(--muted); font-size: .8em; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8em; padding: 1em; text-align: center; }
  #text { font-size: 1.7em; font-weight: 800; letter-spacing: .02em; }
  #sub { color: var(--muted); min-height: 1.3em; white-space: pre-line; }
  #ctl { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8em; position: relative; min-height: 0; }
  #ctl:empty { display: none; }
  form { display: flex; flex-direction: column; gap: .8em; width: min(100%, 22em); }
  input { font: inherit; padding: .8em; border-radius: .6em; border: 2px solid var(--muted); background: var(--panel); color: var(--text); user-select: text; -webkit-user-select: text; }
  button { font: inherit; font-weight: 800; border: 0; border-radius: .6em; padding: .9em; color: #10231a; background: var(--fire); touch-action: manipulation; }
  /* joystick */
  .pad { position: absolute; inset: 0; border: 2px dashed #ffffff22; border-radius: 1em; }
  .pad .hint { position: absolute; inset: 0; display: grid; place-items: center; color: #ffffff44; }
  .ring, .knob { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; }
  .ring { width: 160px; height: 160px; border: 3px solid #ffffff55; }
  .knob { width: 70px; height: 70px; background: var(--me); }
  .meter { width: 100%; height: 1.4em; border-radius: .7em; background: var(--panel); overflow: hidden; }
  .meter div { height: 100%; width: 0; background: linear-gradient(90deg, #3a7, #fd3, #f42); transition: width .2s; }
  /* morse key */
  .key { width: min(70vw, 45vh); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffc56b, var(--fire) 60%, #b86200); box-shadow: 0 10px 0 #7a4100; display: grid; place-items: center; font-size: 1.5em; color: #10231a; }
  .key.down { transform: translateY(8px); box-shadow: 0 2px 0 #7a4100; }
  .sym { font: 800 2.4em/1 ui-monospace, monospace; min-height: 1em; letter-spacing: .1em; }
  .log { font: 700 1.2em ui-monospace, monospace; color: var(--muted); min-height: 1.3em; }
  /* choices */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: .6em; width: 100%; flex: 1; }
  .choices button { color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em; font-size: 1.05em; }
  .choices button b { font-size: 2em; line-height: 1; }
  .choices button:disabled { opacity: .25; }
  .choices button.picked { opacity: 1; outline: 5px solid #fff; }
  body[data-layout=choices] #text { font-size: 1.25em; } /* the quiz question itself */
  body[data-layout=choices] main { justify-content: flex-start; }
</style>
</head>
<body>
<header><span class="av" id="av">⚜️</span><span id="name">JOTA-JOTI</span><span id="status"></span></header>
<main>
  <div id="text"></div>
  <div id="sub"></div>
  <div id="ctl">
    <form id="join">
      <input id="nameIn" maxlength="14" autocomplete="off" required>
      <button id="joinBtn"></button>
    </form>
  </div>
</main>
<script type="module">
import { MorseKey, tone, audio, playWord } from '/morse.js';

const $ = id => document.getElementById(id);
const room = location.pathname.slice(1).toUpperCase();
const id = sessionStorage.jjId ??= String(Math.random()).slice(2); // per tab: survives reloads, two tabs = two players
let ws, ui = {}, name;

// Texts the phone shows on its own. Everything else comes from the big screen, in its language.
const STR = {
  en: { hello: 'Join the game!', name: 'Your name', join: 'Join 📻', connecting: 'Connecting…', in: 'You’re in!', look: 'Look at the big screen 👀',
    reconnecting: 'reconnecting…', drag: 'drag anywhere here', signal: '📡 Signal', key: 'KEY', nohost: 'No big screen with code', check: 'Check the code on the big screen', otherTab: 'Opened in another tab', thisTab: 'Keep playing there, or reload this page' },
  de: { hello: 'Mach mit!', name: 'Dein Name', join: 'Mitmachen 📻', connecting: 'Verbinde…', in: 'Du bist dabei!', look: 'Schau auf den großen Bildschirm 👀',
    reconnecting: 'verbinde neu…', drag: 'irgendwo hier ziehen', signal: '📡 Signal', key: 'TASTE', nohost: 'Kein großer Bildschirm mit Code', check: 'Prüf den Code auf dem großen Bildschirm', otherTab: 'In einem anderen Tab geöffnet', thisTab: 'Spiel dort weiter oder lade diese Seite neu' },
};
const tr = k => (STR[ui.lang] ?? STR[navigator.language?.startsWith('de') ? 'de' : 'en'])[k];
$('text').textContent = tr('hello');
$('nameIn').placeholder = tr('name');
$('joinBtn').textContent = tr('join');

$('nameIn').value = localStorage.jjName || '';
$('join').onsubmit = e => {
  e.preventDefault();
  name = localStorage.jjName = $('nameIn').value.trim().slice(0, 14) || 'Scout';
  audio().resume(); // unlock sound while we still have the user's tap
  $('name').textContent = name;
  show({ layout: 'wait', text: tr('connecting') });
  connect();
};

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?role=player&room=${room}&id=${id}&name=${encodeURIComponent(name)}`);
  ws.onopen = () => { $('status').textContent = ''; if (ui.layout === 'wait' && ui.text === tr('connecting')) show({ layout: 'wait', text: tr('in'), sub: tr('look') }); };
  ws.onmessage = e => { const d = JSON.parse(e.data); show(d.nohost ? { layout: 'wait', text: `${tr('nohost')} ${room}`, sub: tr('check') } : d); };
  ws.onclose = e => {
    if (e.code === 4000) return show({ layout: 'wait', text: tr('otherTab'), sub: tr('thisTab') }); // same player id connected elsewhere
    $('status').textContent = tr('reconnecting');
    setTimeout(connect, 1000 + Math.random() * 2000); // jitter: after a tunnel blip all phones would otherwise retry at once
  };
}
const out = d => ws?.readyState === 1 && (ws.send(JSON.stringify(d)), true);

function show(next) {
  const relayout = next.layout !== ui.layout || next.round !== ui.round; // host bumps `round` to force a fresh controller
  ui = { lang: ui.lang, ...next };
  document.body.dataset.layout = ui.layout;
  if (ui.avatar) $('av').textContent = ui.avatar;
  if (ui.color) document.documentElement.style.setProperty('--me', ui.color);
  $('text').textContent = ui.text ?? '';
  $('sub').textContent = ui.sub ?? '';
  if (ui.buzz) navigator.vibrate?.(ui.buzz);
  if (relayout) { stopRadio(); $('ctl').replaceChildren(...(layouts[ui.layout]?.() ?? [])); }
  if (ui.layout === 'stick' && 'meter' in ui) { meterFill.style.width = ui.meter * 100 + '%'; startRadio(); }
}

const el = (tag, cls, txt) => Object.assign(document.createElement(tag), { className: cls || '', textContent: txt ?? '' });
let meterFill;

const layouts = {
  wait: () => [],

  // Floating joystick: put your thumb down anywhere, drag.
  stick() {
    const pad = el('div', 'pad'), ring = el('div', 'ring'), knob = el('div', 'knob'), meter = el('div', 'meter');
    meterFill = meter.appendChild(el('div'));
    pad.append(el('div', 'hint', tr('drag')), ring, knob);
    let o = null, last = 0;
    const move = e => {
      if (!o) return;
      const r = pad.getBoundingClientRect(), R = 80;
      let x = e.clientX - o.x, y = e.clientY - o.y;
      const d = Math.hypot(x, y);
      if (d > R) { x *= R / d; y *= R / d; }
      Object.assign(knob.style, { left: o.x - r.left + x + 'px', top: o.y - r.top + y + 'px' });
      if (performance.now() - last > 33) { last = performance.now(); out({ t: 'stick', x: x / R, y: y / R }); }
    };
    pad.onpointerdown = e => {
      pad.setPointerCapture(e.pointerId);
      o = { x: e.clientX, y: e.clientY };
      const r = pad.getBoundingClientRect();
      for (const k of [ring, knob]) Object.assign(k.style, { display: 'block', left: o.x - r.left + 'px', top: o.y - r.top + 'px' });
    };
    pad.onpointermove = move;
    pad.onpointerup = pad.onpointercancel = () => { o = null; ring.style.display = knob.style.display = 'none'; out({ t: 'stick', x: 0, y: 0 }); };
    const wrap = el('div');
    Object.assign(wrap.style, { position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', gap: '.6em' });
    const area = el('div');
    Object.assign(area.style, { position: 'relative', flex: 1 });
    area.append(pad);
    wrap.append(...('meter' in ui ? [el('div', '', tr('signal')), meter] : []), area);
    return [wrap];
  },

  // Telegraph key: short press = dit, long press = dah.
  key() {
    const key = el('div', 'key', tr('key')), sym = el('div', 'sym'), log = el('div', 'log');
    const mk = new MorseKey(
      c => { log.textContent = (log.textContent + c).slice(-12); out({ t: 'letter', c }); },
      s => { sym.textContent = s.replace(/\./g, '·').replace(/-/g, '−'); out({ t: 'sym', s }); });
    key.onpointerdown = e => { key.setPointerCapture(e.pointerId); key.classList.add('down'); mk.down(); tone(true); };
    key.onpointerup = key.onpointercancel = () => { key.classList.remove('down'); mk.up(); tone(false); };
    return [sym, key, log];
  },

  // Four big answer buttons; shapes so colour-blind scouts can play too.
  choices() {
    const box = el('div', 'choices');
    ui.options.forEach((txt, i) => {
      const b = el('button');
      b.style.background = CHOICE[i].color;
      b.append(el('b', '', CHOICE[i].shape), el('span', '', txt));
      b.onclick = () => {
        if (!out({ t: 'pick', i })) return; // reconnecting: don't lock the buttons on an answer that never left
        navigator.vibrate?.(30);
        for (const x of box.children) x.disabled = true;
        b.classList.add('picked');
      };
      box.append(b);
    });
    return [box];
  },
};
const CHOICE = [{ shape: '▲', color: '#d4213d' }, { shape: '◆', color: '#1368ce' }, { shape: '●', color: '#c98a00' }, { shape: '■', color: '#26890c' }];

// Fox-hunt receiver: plays "MO" like a real ARDF transmitter; louder, higher and faster as you get closer.
let radioTimer;
function startRadio() {
  if (radioTimer) return;
  const loop = () => {
    const m = ui.meter ?? 0;
    const dur = m > 0.03 ? playWord('MO', 0.06, 420 + 700 * m, 0.04 + 0.4 * m) : 0.3;
    radioTimer = setTimeout(loop, (dur + 1.2 - m) * 1000);
  };
  loop();
}
function stopRadio() { clearTimeout(radioTimer); radioTimer = null; }
</script>
</body>
</html>
